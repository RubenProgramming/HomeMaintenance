name: homemaintenance

services:
  mongo:
    image: mongo:8.0
    container_name: onderhoud-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: onderhoud-backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
    depends_on:
      - mongo

volumes:
  mongo-data: